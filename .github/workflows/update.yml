name: Update Pi-hole blocklists

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Select blocklist profile
        required: true
        default: balanced
        type: choice
        options:
          - balanced
          - full

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blocklist
        env:
          PROFILE: ${{ inputs.profile || 'balanced' }}
        run: python build.py --profile "$PROFILE"

      - name: Split full list into GitHub-friendly files
        env:
          PROFILE: ${{ inputs.profile || 'balanced' }}
        run: python split_blocklist.py --profile "$PROFILE" --max-mib 40

      - name: Commit updated blocklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'blocklist-*.txt'
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update blocklists"
            git push
          else
            echo "Blocklists unchanged"
          fi
