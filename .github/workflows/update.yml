
name: Update Pi-hole blocklists

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Select blocklist profile"
        required: true
        default: balanced
        type: choice
        options:
          - balanced
          - full

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blocklist
        run: |
          python build.py --profile "${{ inputs.profile || 'balanced' }}"

      - name: Commit updated blocklist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist-*.txt
          git diff --cached --quiet || git commit -m "Auto-update blocklists"
          git push
